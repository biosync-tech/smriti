<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowNew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="newLayer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef2f2"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Smriti — from Agent Memory → Integrity Layer for LLM Wikis</text>
  <text x="700" y="62" text-anchor="middle" font-size="14" fill="#64748b">Single Rust binary · Single SQLite file · Zero cloud · MCP-native</text>

  <!-- ============ LEFT: TODAY ============ -->
  <text x="320" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">SMRITI TODAY</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#64748b">read-optimized, write-naive</text>

  <!-- Agents layer -->
  <rect x="80" y="145" width="480" height="55" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Agents (Claude · Cursor · Obsidian human)</text>
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#4338ca">↕ MCP stdio · REST API</text>

  <!-- MCP tools -->
  <rect x="80" y="220" width="480" height="70" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="320" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#0e7490">MCP Tools (flat CRUD)</text>
  <text x="320" y="262" text-anchor="middle" font-size="10" fill="#155e75">notes_create · notes_read · notes_search · notes_search_semantic</text>
  <text x="320" y="278" text-anchor="middle" font-size="10" fill="#155e75">notes_graph · notes_list · memory_store · memory_retrieve</text>

  <!-- Storage -->
  <rect x="80" y="310" width="480" height="110" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">SQLite (FTS5 + vec + WAL)</text>
  <rect x="100" y="345" width="130" height="60" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="165" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">notes</text>
  <text x="165" y="382" text-anchor="middle" font-size="9" fill="#64748b">id · title · content</text>
  <text x="165" y="395" text-anchor="middle" font-size="9" fill="#64748b">FTS5 index</text>

  <rect x="255" y="345" width="130" height="60" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="320" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">links</text>
  <text x="320" y="382" text-anchor="middle" font-size="9" fill="#64748b">bi-temporal</text>
  <text x="320" y="395" text-anchor="middle" font-size="9" fill="#64748b">valid_from/until</text>

  <rect x="410" y="345" width="130" height="60" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="475" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">agent_memory</text>
  <text x="475" y="382" text-anchor="middle" font-size="9" fill="#64748b">KV · namespaces</text>
  <text x="475" y="395" text-anchor="middle" font-size="9" fill="#64748b">TTL</text>

  <!-- Graph cache -->
  <rect x="80" y="440" width="480" height="45" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="461" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">petgraph DiGraph (GraphCache, lazy rebuild)</text>
  <text x="320" y="476" text-anchor="middle" font-size="10" fill="#b45309">BFS ~235ns · FTS5 ~331µs · KV retrieve ~2.48µs</text>

  <!-- Problems today -->
  <rect x="80" y="510" width="480" height="170" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="320" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⚠ Write-side entropy (unsolved)</text>
  <text x="100" y="555" font-size="11" fill="#7f1d1d">✗ Duplicate entities — agents silently create parallel pages</text>
  <text x="100" y="575" font-size="11" fill="#7f1d1d">✗ Non-atomic multi-writes — partial commits corrupt the wiki</text>
  <text x="100" y="595" font-size="11" fill="#7f1d1d">✗ No claim provenance — compound knowledge = compound hallucination</text>
  <text x="100" y="615" font-size="11" fill="#7f1d1d">✗ No contradiction detection — stale facts live forever</text>
  <text x="100" y="635" font-size="11" fill="#7f1d1d">✗ No audit trail — can't replay "what did the wiki believe on March 1?"</text>
  <text x="100" y="655" font-size="11" fill="#7f1d1d">✗ Obsidian edits race with agent edits — no conflict rule</text>

  <!-- ============ ARROW BETWEEN ============ -->
  <path d="M 600 400 L 790 400" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowNew)"/>
  <text x="695" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">integrity layer</text>
  <text x="695" y="420" text-anchor="middle" font-size="10" fill="#dc2626">+ event sourcing</text>

  <!-- ============ RIGHT: PROPOSED ============ -->
  <text x="1080" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">SMRITI + KARPATHY-MODE</text>
  <text x="1080" y="128" text-anchor="middle" font-size="11" fill="#dc2626">write-safe by construction · portable ground truth</text>

  <!-- Agents -->
  <rect x="830" y="145" width="500" height="55" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="1080" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Agents + Human (Obsidian, bidirectional watcher)</text>
  <text x="1080" y="188" text-anchor="middle" font-size="11" fill="#4338ca">↕ MCP · REST · FSEvents/inotify</text>

  <!-- NEW: Integrity layer -->
  <rect x="830" y="220" width="500" height="110" rx="10" fill="url(#newLayer)" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1080" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">◆ Integrity Layer (NEW)</text>
  <rect x="845" y="252" width="150" height="32" rx="4" fill="#fff" stroke="#dc2626"/>
  <text x="920" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">wiki_upsert</text>
  <text x="920" y="297" text-anchor="middle" font-size="8" fill="#7f1d1d">entity resolve · dedup</text>

  <rect x="1005" y="252" width="150" height="32" rx="4" fill="#fff" stroke="#dc2626"/>
  <text x="1080" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">wiki_transaction</text>
  <text x="1080" y="297" text-anchor="middle" font-size="8" fill="#7f1d1d">atomic multi-write</text>

  <rect x="1165" y="252" width="150" height="32" rx="4" fill="#fff" stroke="#dc2626"/>
  <text x="1240" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">wiki_lint</text>
  <text x="1240" y="297" text-anchor="middle" font-size="8" fill="#7f1d1d">contradiction · orphans</text>

  <text x="1080" y="320" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">enforce invariants — make bad writes impossible</text>

  <!-- NEW: Event log -->
  <rect x="830" y="350" width="500" height="70" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.5"/>
  <text x="1080" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#86198f">◆ Append-Only Event Log (NEW)</text>
  <text x="1080" y="391" text-anchor="middle" font-size="10" fill="#701a75">claim_asserted · entity_merged · link_retracted · source_ingested</text>
  <text x="1080" y="408" text-anchor="middle" font-size="10" fill="#701a75">→ time-travel queries · replay across agents · audit trail</text>

  <!-- Projection cache / storage -->
  <rect x="830" y="440" width="500" height="115" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1080" y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Projection Cache (rebuildable from log)</text>
  <rect x="845" y="475" width="105" height="70" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="897" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">notes</text>
  <text x="897" y="508" text-anchor="middle" font-size="8" fill="#64748b">+entity_type</text>
  <text x="897" y="521" text-anchor="middle" font-size="8" fill="#64748b">+canonical_name</text>
  <text x="897" y="534" text-anchor="middle" font-size="8" fill="#64748b">+aliases</text>

  <rect x="960" y="475" width="105" height="70" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="1012" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">links</text>
  <text x="1012" y="508" text-anchor="middle" font-size="8" fill="#64748b">typed layers</text>
  <text x="1012" y="521" text-anchor="middle" font-size="8" fill="#64748b">semantic/temporal</text>
  <text x="1012" y="534" text-anchor="middle" font-size="8" fill="#64748b">/causal</text>

  <rect x="1075" y="475" width="120" height="70" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1135" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">sources ★</text>
  <text x="1135" y="508" text-anchor="middle" font-size="8" fill="#7f1d1d">uri · hash</text>
  <text x="1135" y="521" text-anchor="middle" font-size="8" fill="#7f1d1d">claim_sources</text>
  <text x="1135" y="534" text-anchor="middle" font-size="8" fill="#7f1d1d">(provenance)</text>

  <rect x="1205" y="475" width="115" height="70" rx="5" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="1262" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#86198f">events ★</text>
  <text x="1262" y="508" text-anchor="middle" font-size="8" fill="#701a75">append-only</text>
  <text x="1262" y="521" text-anchor="middle" font-size="8" fill="#701a75">immutable</text>
  <text x="1262" y="534" text-anchor="middle" font-size="8" fill="#701a75">replayable</text>

  <!-- Unlocks -->
  <rect x="830" y="575" width="500" height="170" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1080" y="597" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">✓ What this unlocks</text>
  <text x="850" y="620" font-size="11" fill="#166534">✓ Agents cannot create duplicate entities — enforced at write</text>
  <text x="850" y="640" font-size="11" fill="#166534">✓ Synthesis commits are all-or-nothing (SQLite SAVEPOINT)</text>
  <text x="850" y="660" font-size="11" fill="#166534">✓ Every sentence traceable to source — compound knowledge is auditable</text>
  <text x="850" y="680" font-size="11" fill="#166534">✓ Time-travel: "what did the wiki believe on 2026-03-01?" → one SQL query</text>
  <text x="850" y="700" font-size="11" fill="#166534">✓ .smriti file = portable ground truth, tradable like HuggingFace datasets</text>
  <text x="850" y="720" font-size="11" fill="#166534">✓ Obsidian ↔ agent conflicts resolved by valid_from — loser archived</text>

  <!-- ============ BOTTOM: moat ============ -->
  <rect x="80" y="770" width="1250" height="100" rx="10" fill="#0f172a"/>
  <text x="705" y="798" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">The reframe: Smriti isn't "another agent memory" — it's git for LLM wikis</text>
  <text x="705" y="822" text-anchor="middle" font-size="11" fill="#cbd5e1">Obsidian is a dumb filesystem · Neo4j/Graphiti need servers · Mem0/Letta are cloud lock-in · Zep has bi-temporal but no local-first wiki discipline</text>
  <text x="705" y="842" text-anchor="middle" font-size="11" fill="#fbbf24">Smriti's moat = single SQLite file + transactional integrity + event log + Rust speed → the only runtime where agent-authored knowledge is verifiable</text>
  <text x="705" y="860" text-anchor="middle" font-size="10" fill="#94a3b8">arXiv anchors: Zep 2501.13956 · MAGMA 2601.03236 · AGM 2603.17244 · Graph+BM25 2602.05665</text>

</svg>
